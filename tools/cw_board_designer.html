<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>끄투 십자말풀이 판 모양 디자이너</title>
<style>
	body {
		font-family: "맑은 고딕", sans-serif;
		background: #222;
		color: #eee;
		padding: 20px;
	}
	h1 {
		font-size: 18px;
	}
	#grid {
		display: grid;
		grid-template-columns: repeat(8, 48px);
		grid-template-rows: repeat(8, 48px);
		gap: 2px;
		margin: 16px 0;
	}
	.cell {
		width: 48px;
		height: 48px;
		background: #444;
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 11px;
		color: #888;
		user-select: none;
	}
	.cell.filled {
		background: #DEAF56;
		color: #222;
	}
	.controls {
		margin: 12px 0;
	}
	.controls input {
		font-size: 14px;
		padding: 4px 8px;
		margin-right: 8px;
	}
	.controls button {
		font-size: 14px;
		padding: 4px 12px;
		margin-right: 8px;
		cursor: pointer;
	}
	textarea {
		width: 100%;
		max-width: 640px;
		height: 70px;
		font-family: monospace;
		font-size: 13px;
		box-sizing: border-box;
	}
	.hint {
		font-size: 12px;
		color: #aaa;
		margin-top: 4px;
	}
	label {
		font-size: 13px;
	}
</style>
</head>
<body>
	<h1>끄투 십자말풀이 판 모양 디자이너</h1>
	<p class="hint">칸을 클릭해 판 모양을 그린 뒤 "분석" 버튼을 누르세요. 가로/세로로 이어진 길이 2 이상의 칸 묶음만 단어 슬롯으로 인식됩니다(길이 1인 고립 칸은 무시됩니다).</p>

	<div id="grid"></div>

	<div class="controls">
		<label>판 이름: <input type="text" id="shapeName" placeholder="예: 강아지"></label>
		<button id="analyzeBtn">분석</button>
		<button id="clearBtn">초기화</button>
	</div>

	<div>
		<div class="hint">queue 문자열 (cw_maker.js의 MAPS[].queue에 붙여넣기)</div>
		<textarea id="queueOut" readonly></textarea>
		<button id="copyQueueBtn">복사</button>
	</div>

	<div style="margin-top: 12px;">
		<div class="hint">MAPS 배열 항목 (cw_maker.js의 MAPS 배열에 통째로 붙여넣기)</div>
		<textarea id="entryOut" readonly></textarea>
		<button id="copyEntryBtn">복사</button>
	</div>

	<p id="ignoredHint" class="hint" style="display:none; color:#e8a04c;"></p>

<script>
var SIZE = 8;
var grid = [];
for (var y = 0; y < SIZE; y++) {
	grid.push(new Array(SIZE).fill(false));
}

var $grid = document.getElementById('grid');
var cells = [];
for (var gy = 0; gy < SIZE; gy++) {
	cells.push([]);
	for (var gx = 0; gx < SIZE; gx++) {
		(function (x, y) {
			var $c = document.createElement('div');
			$c.className = 'cell';
			$c.textContent = x + ',' + y;
			$c.addEventListener('click', function () {
				grid[y][x] = !grid[y][x];
				$c.classList.toggle('filled', grid[y][x]);
			});
			$grid.appendChild($c);
			cells[y].push($c);
		})(gx, gy);
	}
}

function analyze() {
	var tokens = [];
	var ignoredCount = 0;
	var x, y, runStart, len;

	// 가로 (dir=0)
	for (y = 0; y < SIZE; y++) {
		runStart = -1;
		for (x = 0; x <= SIZE; x++) {
			var filled = x < SIZE && grid[y][x];
			if (filled && runStart === -1) runStart = x;
			if (!filled && runStart !== -1) {
				len = x - runStart;
				if (len >= 2) tokens.push([runStart, y, 0, len]);
				else ignoredCount++;
				runStart = -1;
			}
		}
	}
	// 세로 (dir=1)
	for (x = 0; x < SIZE; x++) {
		runStart = -1;
		for (y = 0; y <= SIZE; y++) {
			var filled2 = y < SIZE && grid[y][x];
			if (filled2 && runStart === -1) runStart = y;
			if (!filled2 && runStart !== -1) {
				len = y - runStart;
				if (len >= 2) tokens.push([x, runStart, 1, len]);
				else ignoredCount++;
				runStart = -1;
			}
		}
	}

	var queue = tokens.map(function (t) { return t.join(''); }).join(' ');
	document.getElementById('queueOut').value = queue;

	var name = document.getElementById('shapeName').value.trim() || "이름없음";
	var entry = '{\n\tname: "' + name + '",\n\tqueue: "' + queue + '"\n},';
	document.getElementById('entryOut').value = entry;

	var $hint = document.getElementById('ignoredHint');
	if (ignoredCount > 0) {
		$hint.style.display = 'block';
		$hint.textContent = '길이 1(고립 칸) ' + ignoredCount + '개는 최소 길이(2) 미달로 무시되었습니다.';
	} else {
		$hint.style.display = 'none';
	}
}

function clearGrid() {
	for (var y = 0; y < SIZE; y++) {
		for (var x = 0; x < SIZE; x++) {
			grid[y][x] = false;
			cells[y][x].classList.remove('filled');
		}
	}
	document.getElementById('queueOut').value = '';
	document.getElementById('entryOut').value = '';
	document.getElementById('ignoredHint').style.display = 'none';
}

function copyFrom(id) {
	var $ta = document.getElementById(id);
	$ta.select();
	if (navigator.clipboard) navigator.clipboard.writeText($ta.value);
	else document.execCommand('copy');
}

document.getElementById('analyzeBtn').addEventListener('click', analyze);
document.getElementById('clearBtn').addEventListener('click', clearGrid);
document.getElementById('copyQueueBtn').addEventListener('click', function () { copyFrom('queueOut'); });
document.getElementById('copyEntryBtn').addEventListener('click', function () { copyFrom('entryOut'); });
</script>
</body>
</html>
